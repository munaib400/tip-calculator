<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tip Calculator</title>
</head>
<body>
     

        <div class="card">
            <h1>Tip Calculator</h1>
            <p class="description">Enter the bill amount and tip percentage to calculate the total.</p>
            <form>
                <label for="bill">Bill amount:</label><br>
                <input type="number" id="bill"><br>
                <label for="tip">Tip percentage:</label><br>
                <input type="number" id="tip">
            </form>
            <button class="calculate" id="btn">Calculate</button>

            <label for="total">Total:</label>
            <span id="total"></span>
        </div>
    
        <script src="script.js"></script>
</body>
</html>
